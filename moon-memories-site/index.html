<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>A Present From Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     EDIT YOUR MEMORIES IN THE <script> SECTION AT THE BOTTOM.
     Look for "const memories = [ ... ]". Also edit finaleTitle /
     finaleText just above it, and HER_NAME near the top of the
     script, to personalize the ending message.
     ============================================================ */

  :root{
    --sky-deep:   #080a1c;
    --sky-mid:    #121736;
    --sky-soft:   #232a5c;
    --moon-glow:  #fbf3de;
    --star-gold:  #f4c868;
    --lavender:   #a79ed1;
    --ink:        #f3efe4;
    --ink-dim:    #b9b6c9;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background: var(--sky-deep);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- Sky ---------- */
  #sky{
    position: fixed; inset: -4% -4% -4% -4%;
    background:
      radial-gradient(ellipse 120% 60% at 50% 100%, var(--sky-soft) 0%, transparent 55%),
      linear-gradient(180deg, var(--sky-deep) 0%, var(--sky-mid) 55%, var(--sky-soft) 100%);
    overflow: hidden;
    will-change: transform;
    contain: strict;
  }

  .twinkle{
    position: absolute;
    width: 2px; height: 2px;
    background: var(--ink);
    border-radius: 50%;
    opacity: 0.25;
    animation: tw 4s ease-in-out infinite;
  }
  @keyframes tw{
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.85; }
  }

  /* ---------- Scroll container ---------- */
  #journey{
    position: relative;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  #track{
    position: relative;
    width: 100%;
    height: 340vh;
    contain: layout style;
  }

  svg#path-svg{
    position: absolute; top:0; left:0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  .seg{
    fill: none;
    stroke: var(--star-gold);
    stroke-width: 1.6;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .seg.drawing{ opacity: 0.9; }

  /* ---------- Header ---------- */
  #intro{
    position: absolute; top: 6vh; left: 0; right: 0;
    text-align: center;
    padding: 0 24px;
    z-index: 3;
  }
  #intro h1{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(28px, 7vw, 44px);
    margin: 0 0 10px;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  #intro p{
    font-size: 14px;
    color: var(--ink-dim);
    margin: 0;
    line-height: 1.6;
  }
  #progress-label{
    margin-top: 14px;
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--star-gold);
  }

  /* ---------- Star nodes ---------- */
  .star-node{
    position: absolute;
    width: 54px; height: 54px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    background: none; border: none;
    padding: 0;
    opacity: 0;
    transform: translate(-50%, calc(-50% + 16px)) scale(0.82);
    pointer-events: none;
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(.2,.7,.3,1);
    touch-action: manipulation;
  }
  .star-node.revealed{
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }
  .star-node .glow{
    position: absolute;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(244,200,104,0.35) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .star-node.unlocked .glow{ opacity: 1; }

  .star-node.next svg{ animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(243,239,228,0.4)); }
    50% { transform: scale(1.18); filter: drop-shadow(0 0 7px rgba(244,200,104,0.75)); }
  }

  .star-node svg{
    width: 22px; height: 22px;
    position: relative;
    z-index: 1;
  }
  .star-node .star-fill{
    fill: rgba(243,239,228,0.6);
    transition: fill 0.4s ease;
  }
  .star-node.unlocked .star-fill{
    fill: var(--star-gold);
  }
  .star-node.unlocked svg{
    filter: drop-shadow(0 0 5px rgba(244,200,104,0.8));
  }
  .star-node:active svg{ transform: scale(0.86); }

  .star-node .label{
    position: absolute;
    top: 60px;
    white-space: nowrap;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
    opacity: 0.85;
    pointer-events: none;
  }

  /* spark burst on unlock */
  .spark{
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--star-gold);
    left: 50%; top: 50%;
    pointer-events: none;
    animation: spark-out 0.6s ease-out forwards;
  }
  @keyframes spark-out{
    0% { opacity: 1; transform: translate(-50%,-50%) translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(0.3); }
  }

  /* ---------- Moon ---------- */
  #moon-wrap{
    position: absolute;
    top: 22vh; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center;
    z-index: 2;
  }
  /* ---------- Music toggle ---------- */
  #music-btn{
    position: fixed;
    top: max(18px, env(safe-area-inset-top, 0px));
    right: 18px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(243,239,228,0.25);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 30;
    backdrop-filter: none;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  #music-btn svg{ width: 18px; height: 18px; }
  #music-btn .bar{
    fill: var(--ink);
    transform-origin: bottom;
  }
  #music-btn.playing{
    border-color: rgba(244,200,104,0.6);
    background: rgba(244,200,104,0.12);
  }
  #music-btn.playing .bar{ animation: eq 0.9s ease-in-out infinite; }
  #music-btn.playing .bar:nth-child(2){ animation-delay: 0.15s; }
  #music-btn.playing .bar:nth-child(3){ animation-delay: 0.3s; }
  @keyframes eq{
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  #moon{
    width: 108px; height: 108px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--moon-glow) 45%, #e9d9ad 100%);
    box-shadow: 0 0 18px rgba(251,243,222,0.12);
    position: relative;
    cursor: pointer;
    transition: box-shadow 0.8s ease, transform 0.4s ease;
    border: none;
  }
  #moon.complete{
    box-shadow: 0 0 70px rgba(251,243,222,0.75), 0 0 130px rgba(244,200,104,0.4);
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.035); }
  }
  #moon::before, #moon::after{
    content:'';
    position: absolute;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
  }
  #moon::before{ width: 20px; height: 20px; top: 22px; left: 20px; }
  #moon::after{ width: 12px; height: 12px; top: 60px; left: 55px; }
  #moon-caption{
    margin-top: 14px;
    font-size: 12px;
    color: var(--ink-dim);
    text-align: center;
    max-width: 220px;
    line-height: 1.5;
  }

  /* ---------- Memory panel (bottom sheet) ---------- */
  #overlay{
    position: fixed; inset: 0;
    background: rgba(4,5,16,0.55);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 10;
  }
  #overlay.open{ opacity: 1; pointer-events: auto; }

  #panel{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    background: linear-gradient(180deg, var(--sky-soft) 0%, var(--sky-mid) 100%);
    border-radius: 22px 22px 0 0;
    padding: 22px 24px 28px;
    transform: translateY(105%);
    transition: transform 0.4s cubic-bezier(.22,.68,.35,1);
    z-index: 11;
    max-height: 82vh;
    overflow-y: auto;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.35);
  }
  #panel.open{ transform: translateY(0); }

  #panel-close{
    display: block;
    margin: 0 0 14px auto;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: none;
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }

  .panel-date{
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--star-gold);
    margin-bottom: 6px;
  }
  .panel-title{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 26px;
    margin: 0 0 16px;
  }
  .panel-photo{
    width: 100%;
    max-height: 60vh;
    min-height: 140px;
    border-radius: 14px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, var(--sky-soft), #3a2f5c 60%, var(--sky-mid));
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .panel-photo:has(img){ aspect-ratio: auto; }
  .panel-photo:not(:has(img)){ aspect-ratio: 4/3; }
  .panel-photo img{ width: 100%; height: 100%; max-height: 60vh; object-fit: contain; display: block; }
  .panel-photo svg{ width: 34px; height: 34px; opacity: 0.5; }

  .panel-text{
    font-size: 15px;
    line-height: 1.75;
    color: var(--ink);
    font-weight: 400;
    margin: 0 0 16px;
  }
  #panel-next{
    background: rgba(244,200,104,0.12);
    border: 1px solid rgba(244,200,104,0.35);
    color: var(--star-gold);
    padding: 10px 18px;
    border-radius: 30px;
    font-size: 13px;
    cursor: pointer;
    width: 100%;
  }

  /* ---------- Final message ---------- */
  #finale{
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, #1c2350 0%, var(--sky-deep) 70%);
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    padding: 32px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease;
    z-index: 20;
  }
  #finale.open{ opacity: 1; pointer-events: auto; }
  #finale h2{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(26px, 8vw, 40px);
    margin: 0 0 16px;
  }
  #finale-inner{
    max-height: 86vh;
    overflow-y: auto;
    padding: 4px 4px 8px;
  }
  #finale p{
    font-size: 15px;
    line-height: 1.85;
    color: var(--ink-dim);
    max-width: 400px;
    margin: 0 auto 18px;
    text-align: left;
    white-space: pre-line;
  }
  #finale button{
    background: none;
    border: 1px solid rgba(243,239,228,0.35);
    color: var(--ink);
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 13px;
    letter-spacing: 0.04em;
    cursor: pointer;
  }

  #scroll-hint{
    position: absolute;
    bottom: 26px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--ink-dim);
    opacity: 0.7;
    letter-spacing: 0.05em;
    z-index: 3;
  }
</style>
</head>
<body>

<div id="sky"></div>

<button id="music-btn" aria-label="Play background music" aria-pressed="false">
  <svg viewBox="0 0 18 18">
    <rect class="bar" x="2"  y="6" width="3" height="10" rx="1"></rect>
    <rect class="bar" x="7.5" y="2" width="3" height="14" rx="1"></rect>
    <rect class="bar" x="13" y="8" width="3" height="8" rx="1"></rect>
  </svg>
</button>
<audio id="bgm" src="audio/cafuneslowed.mp3" loop preload="none"></audio>

<div id="journey">
  <div id="track">
    <div id="intro">
      <h1>find your way to the moon</h1>
      <p>a star will only show itself<br>once the one before it has been found.</p>
      <div id="progress-label">0 / 7 found</div>
    </div>

    <svg id="path-svg" viewBox="0 0 100 340" preserveAspectRatio="none"></svg>

    <div id="moon-wrap">
      <button id="moon" aria-label="The moon"></button>
      <div id="moon-caption">Watch Moon glow as your presence nears</div>
    </div>

    <div id="stars-layer"></div>

    <div id="scroll-hint">scroll ↓ to begin</div>
  </div>
</div>

<div id="overlay"></div>
<div id="panel">
  <button id="panel-close" aria-label="Close">✕</button>
  <div class="panel-date" id="panel-date"></div>
  <h3 class="panel-title" id="panel-title"></h3>
  <div class="panel-photo" id="panel-photo"></div>
  <p class="panel-text" id="panel-text"></p>
  <button id="panel-next">continue the path →</button>
</div>

<div id="finale">
  <div id="finale-inner">
    <h2 id="finale-title"></h2>
    <p id="finale-text"></p>
    <button id="finale-close">close</button>
  </div>
</div>

<script>
/* ================================================================
   EDIT EVERYTHING BELOW TO PERSONALIZE THE PAGE.
================================================================= */

// Her name, used only in the finale message below.
const HER_NAME = "love"; // e.g. "Alex" — leave as "love" if you'd rather not use a name

const finaleTitle = `So finally, you're here Love`;

document.getElementById('finale-title').textContent = finaleTitle;
document.getElementById('finale-text').textContent = finaleText;

const svg = document.getElementById('path-svg');
const starsLayer = document.getElementById('stars-layer');
const progressLabel = document.getElementById('progress-label');
const moon = document.getElementById('moon');
const moonCaption = document.getElementById('moon-caption');

const N = memories.length;
const points = [];
const topY = 62;
const bottomY = 320;
for (let i = 0; i < N; i++) {
  const t = i / (N - 1);
  const y = bottomY - t * (bottomY - topY);
  const x = 50 + Math.sin(i * 1.8) * 28;
  points.push({ x, y });
}
const moonPoint = { x: 50, y: 24 };
const allPts = points.concat([moonPoint]); // N+1 points, N segments

// Build N path segments (0..N-1), each connecting allPts[i] -> allPts[i+1]
const segEls = [];
for (let i = 0; i < N; i++) {
  const a = allPts[i], b = allPts[i + 1];
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const d = `M${a.x.toFixed(2)} ${a.y.toFixed(2)} L${b.x.toFixed(2)} ${b.y.toFixed(2)}`;
  path.setAttribute('d', d);
  path.setAttribute('class', 'seg');
  const len = Math.hypot(b.x - a.x, (b.y - a.y) * 3.4); // rough length weighting for viewBox stretch
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  path.style.transition = 'stroke-dashoffset 0.9s ease, opacity 0.5s ease';
  svg.appendChild(path);
  segEls.push(path);
}

let unlockedCount = 0;
const starEls = [];

points.forEach((p, i) => {
  const mem = memories[i];
  const btn = document.createElement('button');
  btn.className = 'star-node' + (i === 0 ? ' revealed next' : '');
  btn.style.left = p.x + '%';
  btn.style.top = (p.y / 340 * 100) + '%';
  btn.setAttribute('aria-label', 'Memory: ' + mem.title);
  btn.innerHTML = `
    <span class="glow"></span>
    <svg viewBox="0 0 24 24"><path class="star-fill" d="M12 2l2.6 6.9L22 10l-5.6 4.6L17.9 22 12 18.1 6.1 22l1.5-7.4L2 10l7.4-1.1L12 2z"/></svg>
    <span class="label">${mem.title}</span>
  `;
  btn.addEventListener('click', () => openPanel(i, btn));
  starsLayer.appendChild(btn);
  starEls.push(btn);
});

function spawnSparks(btn){
  for (let k = 0; k < 6; k++) {
    const s = document.createElement('span');
    s.className = 'spark';
    const angle = (Math.PI * 2 * k) / 6;
    s.style.setProperty('--dx', (Math.cos(angle) * 26) + 'px');
    s.style.setProperty('--dy', (Math.sin(angle) * 26) + 'px');
    btn.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}

function revealNext(i){
  // reveal segment i (connects star i to star i+1, or star i to moon if last)
  const seg = segEls[i];
  requestAnimationFrame(() => {
    seg.classList.add('drawing');
    seg.style.strokeDashoffset = 0;
  });

  if (i < N - 1) {
    const nextStar = starEls[i + 1];
    nextStar.classList.add('revealed', 'next');
  } else {
    moon.classList.add('complete');
    moonCaption.textContent = 'every star found — tap the moon';
  }
}

function openPanel(i, btn){
  const mem = memories[i];
  document.getElementById('panel-date').textContent = mem.date || '';
  document.getElementById('panel-title').textContent = mem.title || '';
  document.getElementById('panel-text').textContent = mem.text || '';
  const photoEl = document.getElementById('panel-photo');
  if (mem.photo) {
    photoEl.innerHTML = `<img src="${mem.photo}" alt="${mem.title}">`;
  } else {
    photoEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#f3efe4" stroke-width="1.4"><path d="M12 21s-7.5-4.6-10-9.3C.3 8.1 2.4 4 6.3 4c2.2 0 3.7 1.2 5.7 3.4C14 5.2 15.5 4 17.7 4c3.9 0 6 4.1 4.3 7.7C19.5 16.4 12 21 12 21z"/></svg>`;
  }

  const nextBtn = document.getElementById('panel-next');
  nextBtn.textContent = (i === N - 1) ? 'reach the moon →' : 'continue the path →';
  nextBtn.onclick = () => {
    closePanel();
    setTimeout(() => {
      const targetEl = (i === N - 1) ? moon : starEls[i + 1];
      targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 150);
  };

  if (!btn.classList.contains('unlocked')) {
    btn.classList.remove('next');
    btn.classList.add('unlocked');
    spawnSparks(btn);
    unlockedCount++;
    progressLabel.textContent = unlockedCount + ' / ' + N + ' found';
    revealNext(i);
  }

  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}

function closePanel(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
}
document.getElementById('panel-close').addEventListener('click', closePanel);
document.getElementById('overlay').addEventListener('click', closePanel);

moon.addEventListener('click', () => {
  if (unlockedCount === N) {
    document.getElementById('finale').classList.add('open');
  } else {
    moonCaption.textContent = `find the last ${N - unlockedCount} star${N - unlockedCount === 1 ? '' : 's'} first`;
  }
});
document.getElementById('finale-close').addEventListener('click', () => {
  document.getElementById('finale').classList.remove('open');
});

// Background twinkle stars — few elements, pure CSS animation, set once
const sky = document.getElementById('sky');
const frag = document.createDocumentFragment();
for (let i = 0; i < 26; i++) {
  const s = document.createElement('div');
  s.className = 'twinkle';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.animationDelay = (Math.random() * 4) + 's';
  s.style.animationDuration = (3 + Math.random() * 3) + 's';
  frag.appendChild(s);
}
sky.appendChild(frag);

// Background music toggle — starts/stops on tap (browsers block un-muted
// autoplay, so it only ever plays after the person taps the button).
const musicBtn = document.getElementById('music-btn');
const bgm = document.getElementById('bgm');
bgm.volume = 0.55;
musicBtn.addEventListener('click', () => {
  if (bgm.paused) {
    bgm.play().catch(() => {
      // file missing or blocked — fail quietly, no broken UI
    });
    musicBtn.classList.add('playing');
    musicBtn.setAttribute('aria-pressed', 'true');
    musicBtn.setAttribute('aria-label', 'Pause background music');
  } else {
    bgm.pause();
    musicBtn.classList.remove('playing');
    musicBtn.setAttribute('aria-pressed', 'false');
    musicBtn.setAttribute('aria-label', 'Play background music');
  }
});

// Gentle single-layer parallax on scroll, rAF-throttled, GPU-composited
const journeyEl = document.getElementById('journey');
let ticking = false;
journeyEl.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(() => {
      const offset = journeyEl.scrollTop * 0.06;
      sky.style.transform = `translate3d(0, ${offset}px, 0)`;
      ticking = false;
    });
    ticking = true;
  }
}, { passive: true });
</script>
</body>
</html>
